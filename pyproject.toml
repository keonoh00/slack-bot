[project]
name = "ksign-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "fastapi[standard]>=0.151.0",
    "slack-sdk>=3.45.0",
]


[tool.poe.tasks]
dev = { cmd = "fastapi dev", envfile = ".env.dev" }
prod = { cmd = "fastapi run", envfile = ".env.prod" }

setup-dev = { cmd = "docker compose up -d", envfile = ".env.dev" }
setup-prod = { cmd = "docker compose up -d", envfile = ".env.prod" }

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
]
