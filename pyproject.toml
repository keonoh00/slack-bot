[project]
name = "slack-bot"
version = "0.1.0"
description = "Slack bot that answers questions about your PDF documents with a self-hosted LLM and RAG"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "celery[redis]>=5.3.1",
    "fastapi[standard]>=0.151.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "pydantic>=2.14.1",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.2.0",
    "slack-sdk>=3.45.0",
]


[tool.poe.tasks]
dev-api = { cmd = "fastapi dev", envfile = ".env.dev" }
dev-docker = { cmd = "docker compose up -d", envfile = ".env.dev" }
dev-celery = { cmd = "watchfiles --filter python 'celery -A app.celery:celeryApp worker --loglevel=INFO --pool=solo' app", envfile = ".env.dev" }
dev-tunnel = { cmd = "cloudflared tunnel run --token $CLOUDFLARE_TUNNEL_TOKEN", envfile = ".env.dev" }
rag-index = { cmd = "python data/pdf/index.py", envfile = ".env.dev" }

prod-celery = { cmd = "celery -A app.celery:celeryApp worker --pool=prefork --concurrency=1 --loglevel=INFO", envfile = ".env.prod" }


[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "poethepoet>=0.49.0",
    "pymupdf>=2.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "watchfiles>=1.3.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
