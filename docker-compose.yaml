name: slack-bot-dev

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --save "" --appendonly no
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant-data:/qdrant/storage
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    volumes:
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY is required}
    ipc: host
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen3.8-27B-FP8}
      --max-model-len ${VLLM_MAX_LEN:-32768}
      --max-cudagraph-capture-size 32
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_GPUS:-0}"]
              capabilities: [gpu]
