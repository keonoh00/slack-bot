name: slack-bot-dev

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --save "" --appendonly no
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:6333:6333"
    volumes:
      - ./qdrant-data:/qdrant/storage
  vllm:
    image: vllm/vllm-openai:v0.32.0
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${VLLM_PORT:-8000}:8000"
    volumes:
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY is required}
    ipc: host
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen3.8-27B-FP8}
      --max-model-len ${VLLM_MAX_LEN:-32768}
      --max-cudagraph-capture-size 32
      --enable-auto-tool-choice
      --tool-call-parser ${VLLM_TOOL_CALL_PARSER:-qwen3_coder}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_GPUS:-0}"]
              capabilities: [gpu]
